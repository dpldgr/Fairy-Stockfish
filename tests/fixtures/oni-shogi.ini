# Oni Shogi (鬼将棋), 11x11, 27 pieces per side.
# Based on the supplied rules transcription; original Japanese rules take precedence:
# https://web.archive.org/web/20200130231217/http://daraki.fc2web.com/onishogi.html
# Starting diagram follows the supplied transcription, not an independently verified image.
# Convention: capturable King (no check protection), with our agreed reciprocal baring.
# Repetition/stalemate settings below adopt standard Shogi conventions where unspecified.

[oni-shogi]
maxFile = 11
maxRank = 11

# 王羅 Ora: King; 金剛 Kongo: Gold General. Neither promotes.
piece = k:<commoner>
piece = g:<gold>
# 夜叉 Yasha -> 成叉: Silver -> Gold
piece = s:<silver> +s:<gold>
# 蓮華 Renge -> 成連: diagonal stepper -> Bishop
piece = re:<fers> +re:<bishop>
# 迦羅 Kara -> 成迦: Shogi Knight -> Gold
piece = n:<shogiKnight> +n:<gold>
# 沙羅 Sara -> 成沙: Lance -> Gold
piece = l:<lance> +l:<gold>
# 風羅 Fura -> 嵐: Bishop -> Dragon Horse
piece = b:<bishop> +b:<dragonHorse>
# 雷羅 Raira -> 覇: Rook -> Dragon King
piece = r:<rook> +r:<bers>
# 修羅 Shura -> 凰: orthogonal stepper -> Queen
piece = sh:<wazir> +sh:<queen>
# 氷羅 Hyora -> 成氷: forward-diagonal slider -> Silver
piece = hy:fB +hy:<silver>
# 凶羅 Kyora -> 成き: forward/backward stepper -> Silver
piece = ky:fbW +ky:<silver>
# 不空 Fuku -> 成ふ: Shogi Pawn -> Gold
piece = p:<shogiPawn> +p:<gold>

promotionRegionOptionalWhite = *8 *9 *10 *11
promotionRegionOptionalBlack = *1 *2 *3 *4
promotionRegionMandatoryWhite<p> = *11
promotionRegionMandatoryBlack<p> = *1
promotionRegionMandatoryWhite<l> = *11
promotionRegionMandatoryBlack<l> = *1
promotionRegionMandatoryWhite<n> = *10 *11
promotionRegionMandatoryBlack<n> = *1 *2
promotionRegionMandatoryWhite<hy> = *11
promotionRegionMandatoryBlack<hy> = *1
promotionPolicy = optional:{all} mandatory:{oi}
immobilityIllegal = true

castling = false
doubleStep = false
pieceDrops = false
capturesToHand = false
extinctionValue = loss
extinctionPseudoRoyal = false
extinctionPieceTypes = {k}
baringRule = true
baringValue = loss
baringRuleRoyalTypes = {k}

# Standard Shogi conventions, rather than independently documented Oni exceptions.
nMoveRule = 0
nFoldRule = 4
nFoldValue = draw
perpetualCheckIllegal = true
stalemateValue = loss

startFen = l,n,re,s,g,k,g,s,re,n,l/1,r,7,b,1/2,hy,2,sh,2,hy,2/p,p,ky,p,p,ky,p,p,ky,p,p/11/11/11/P,P,KY,P,P,KY,P,P,KY,P,P/2,HY,2,SH,2,HY,2/1,B,7,R,1/L,N,RE,S,G,K,G,S,RE,N,L w - - 0 1
