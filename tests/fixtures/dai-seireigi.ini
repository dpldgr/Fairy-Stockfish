# { Dai Seireigi
# Rules: https://www.chessvariants.com/rules/daiseireigi
# Requires a 16x16-or-larger executable with at least 128 piece slots.
# Load this standalone file with: stockfish load dai-seireigi.ini
# dai-seireigi is the initial version without drops; dai-seireigi-drops derives
# from it and adds Shogi capture-to-hand and drop rules.
#
# Agreed interpretation: Bishop/Vice General rays are diagonal only; screened
# captures cross 1-3 pieces. Lion Hawk = BNAD, Wizard Stork = QAD.
# LIMITATIONS: screened rays also give check against the King here.
# The published King-target exception and 103-point impasse scoring are omitted;
# adjudicate impasse externally (10/5/1 points, based on the original piece).

[dai-seireigi]
maxFile = 15
maxRank = 15
variantTemplate = shogi
pieceToCharTable = -

# King: native royal, protected by check/checkmate.
piece = k:<king>
# Pawn -> Tokin (Gold General)
piece = p:<shogiPawn> +p:<g>
# Lance -> Free Tiger
piece = l:<lance> +l:<ft>
# Ram's-Head Soldier -> Treacherous Fox
piece = rh:fB +rh:<tf>
# Running Rabbit -> Prancing Stag
piece = rr:fBfR +rr:<ps>
# Stone General -> Flying Falcon
piece = st:fF +st:<ff>
# Iron General -> Cloud Eagle
piece = ig:fK +ig:<ce>
# Knight -> Heavenly Horse
piece = n:<shogiKnight> +n:<hh>
# Flying Swallow -> Golden Bird
piece = fs:fAfD +fs:<gb>
# Flying Cat -> Great Dream-Eater
piece = fc:fGfH +fc:<gd>
# Thunder Runner -> Free Demon
piece = tr:fCfZ +tr:<fd>
# Copper General -> Great Leopard
piece = c:fFvW +c:<gl>
# Silver General -> Running Wolf
piece = s:<silver> +s:<rw>
# Gold General -> Great Elephant
piece = g:<gold> +g:<ge>
# Strong Bear -> Whale
piece = sb:FsfW +sb:<wh>
# Roaring Dog -> Wizard Stork
piece = rd:bFsWfsNfsCfsZ +rd:<ws>
# Flying Falcon -> Ancient Dragon
piece = ff:WfFvD +ff:<ad>
# Cloud Eagle -> Square Mover
piece = ce:FvWfA +ce:<sm>
# Great Leopard -> Flying Ox
piece = gl:sRfFbW +gl:<fo>
# Running Wolf -> Free Boar
piece = rw:vRfFsW +rw:<fb>
# Great Elephant -> Teaching King
piece = ge:fBbFsfW +ge:<tk>
# Kirin -> Bishop
piece = kn:FD +kn:<b>
# Phoenix -> Rook
piece = px:WA +px:<r>
# Bishop -> Dragon Horse
piece = b:<bishop> +b:<dh>
# Rook -> Dragon King
piece = r:<rook> +r:<dk>
# Bishop General -> Vice General
piece = bg:Bcp[1..3]B +bg:<vg>
# Rook General -> Great General
piece = rg:Rcp[1..3]R +rg:<gg>
# Lion Hawk, Queen, Capricorn and Hook Mover do not promote.
piece = lh:BNAD
piece = q:<queen>
piece = ca:B
piece = hm:R

# Promoted forms. Explicit references preserve each captured piece's origin;
# a promoted Pawn/Kirin/etc. cannot promote again as its destination type.
piece = ft:sRvWsN
piece = tf:vRsWvN
piece = ps:fBsRvW
piece = hh:FfWbNfAfD
piece = gb:fFvWfhNbAsbD
piece = gd:vRcp[1..3]vRfBbCbZ
piece = fd:fBcp[1..3]fBsRbsCbsZ
piece = wh:fBbRbFfWbsN
piece = ws:QAD
piece = ad:fBbFbG
piece = sm:fRsbWsbH
piece = fo:BvR
piece = fb:BsR
piece = tk:fBvRbFsW
piece = dh:<dragonHorse>
piece = dk:<bers>
piece = vg:BNADcp[1..3]B
piece = gg:Qcp[1..3]Q

# Hooks turn 90 degrees at an empty square and stop on capture.
# Ordinary first-leg-only moves/captures come from the piece definitions above.
hookMovePieces = hm:R-sR:1! ca:B-sB:1! ad:fB-sB:1! sm:fR-sR:1!

# Standard Shogi promotion opportunities: enter, move within, or leave the zone.
promotionRegionOptionalWhite = *11 *12 *13 *14 *15
promotionRegionOptionalBlack = *1 *2 *3 *4 *5
promotionRegionMandatoryWhite = -
promotionRegionMandatoryBlack = -
promotionPolicy = optional:{all} mandatory:{oi}

# Mandatory promotion on the last rank.
promotionRegionMandatoryWhite<p> = *15
promotionRegionMandatoryBlack<p> = *1
promotionRegionMandatoryWhite<l> = *15
promotionRegionMandatoryBlack<l> = *1
promotionRegionMandatoryWhite<rh> = *15
promotionRegionMandatoryBlack<rh> = *1
promotionRegionMandatoryWhite<rr> = *15
promotionRegionMandatoryBlack<rr> = *1
promotionRegionMandatoryWhite<st> = *15
promotionRegionMandatoryBlack<st> = *1
promotionRegionMandatoryWhite<ig> = *15
promotionRegionMandatoryBlack<ig> = *1
# Last two ranks.
promotionRegionMandatoryWhite<n> = *14 *15
promotionRegionMandatoryBlack<n> = *1 *2
promotionRegionMandatoryWhite<fs> = *14 *15
promotionRegionMandatoryBlack<fs> = *1 *2
# Last three ranks.
promotionRegionMandatoryWhite<fc> = *13 *14 *15
promotionRegionMandatoryBlack<fc> = *1 *2 *3
promotionRegionMandatoryWhite<tr> = *13 *14 *15
promotionRegionMandatoryBlack<tr> = *1 *2 *3

castling = false
doubleStep = false
enPassantTypes = -
promotionPawnTypes = -
promotionPieceTypes = -
pieceDrops = false
capturesToHand = false
# The mandatory regions above prevent pieces moving onto their dead ranks.
immobilityIllegal = true

nMoveRule = 0
nFoldRule = 4
nFoldValue = draw
perpetualCheckIllegal = true
stalemateValue = loss

# White setup follows the diagram; Black is its 180-degree rotation.
# 59 pieces per side: 15 + 9 + 11 + 9 + 15, with five empty middle ranks.
startFen = l,rh,fc,rd,rg,sb,g,k,g,sb,bg,rd,fc,rh,l/1,n,1,rr,1,tr,s,ge,s,tr,1,rr,1,n,1/fs,1,st,1,ig,px,c,lh,c,kn,ig,1,st,1,fs/1,ce,1,rw,1,r,hm,q,ca,b,1,gl,1,ff,1/p,p,p,p,p,p,p,p,p,p,p,p,p,p,p/15/15/15/15/15/P,P,P,P,P,P,P,P,P,P,P,P,P,P,P/1,FF,1,GL,1,B,CA,Q,HM,R,1,RW,1,CE,1/FS,1,ST,1,IG,KN,C,LH,C,PX,IG,1,ST,1,FS/1,N,1,RR,1,TR,S,GE,S,TR,1,RR,1,N,1/L,RH,FC,RD,BG,SB,G,K,G,SB,RG,RD,FC,RH,L w - - 0 1
# } Dai Seireigi

# { Dai Seireigi with drops
# Multi-character hands use comma-separated entries: [RR] is one Running Rabbit,
# [R,R] is two Rooks. Requires the engine's whole-symbol FEN/SFEN hand support.
[dai-seireigi-drops:dai-seireigi]
pieceDrops = true
capturesToHand = true
dropLoop = false
dropPromoted = false
# Inherited immobilityIllegal also forbids drops onto each type's dead ranks.
dropNoDoubled = p
shogiPawnDropMateIllegal = true
# } Dai Seireigi with drops
