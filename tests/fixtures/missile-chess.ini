# 8 files x 10 ranks, with a missile behind each rook.
# Pawns are enemy-only air defence; friendly pawns and rooks permit passage.
# Royals are captured, permitting self-destructive strikes (the mover loses
# if both sides lose their last royal). Castling is retained without check.
[missile-chess:chess]
maxFile = 8
maxRank = 10
king = -
commoner = k
pieceToCharTable = -
castlingKingPiece = k
castlingRank = 2
piece = m:K
rangeJumpPieces = m:R:{p=enemy}
prohibitedCaptures = m:p
missileEffectPieces = {m}
doubleStepRegionWhite = *3
doubleStepRegionBlack = *8
enPassantRegionWhite = *7
enPassantRegionBlack = *4
promotionRegionOptionalWhite<pawn> = -
promotionRegionOptionalBlack<pawn> = -
promotionRegionMandatoryWhite<pawn> = *9 *10
promotionRegionMandatoryBlack<pawn> = *1 *2
promotionPolicy = optional:{} mandatory:{oi}
extinctionValue = loss
extinctionPseudoRoyal = false
extinctionPieceTypes = k
extinctionPieceCount = 0
stalemateValue = loss
startFen = m6m/rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR/M6M w KQkq - 0 1
