# { Tai Shogi
# Source: https://en.wikipedia.org/wiki/Tai_shogi (retrieved 2026-11-05).
# Follows the English article's MAIN movement/promotion tables, not the
# conflicting Japanese-Wikipedia promotion alternatives in its footnotes.
# 25x25; 177 pieces per side; 93 initial + 8 promoted-only named types.
# Use the existing 36x36 / 512-slot executable for initial play/testing.
# Geometry/slot minimum: board_files=25 board_ranks=25 piece_slots=192 gating=no.
# A sparse Emperor search hit a classical-evaluation Score overflow assertion
# in the current 25x25 debug build; that build's move-generation checks pass.
# Full-start search is slow: two depth-one smoke runs were interrupted after
# over a minute in their first iteration. Search performance needs further work.
#
# CONFIGURATION DRAFT: contagious promotion is not implemented. Capturing
# Deva/Teaching King/Dark Spirit/Buddhist Spirit performs only the capturer's
# ordinary first-capture promotion, if any; it does not infect/re-promote it.
# All named pieces have movement; there are no immobile placeholders.
# Source conflicts and remaining adjudication approximations are noted below.
# Ordinary single moves belong to piece definitions; masks add multi-leg paths.

[tai-shogi]
maxFile = 25
maxRank = 25
pieceToCharTable = -
castling = false
doubleStep = false
enPassantTypes = -
pieceDrops = false
capturesToHand = false
promotionPawnTypes = -
promotionPieceTypes = -
immobilityIllegal = false

# Emperor ((自在)天王)
# Protected-royal captures are restricted by tradingRule below.
piece = e:U
# Prince (太子)
# Use main table: no Emperor promotion. Drunken Elephant promotes into this same Prince slot.
piece = cp:K
# Hook mover (鉤行) -> Gold general
piece = hm:R +hm:<g>
# Long-nosed goblin (天狗)
# Includes the orthogonal W steps given by this Tai article; hook stops on capture.
piece = lo:WB
# Capricorn (*摩𩹄(羯)) -> Gold general
piece = ca:B +ca:<g>
# Peacock (孔雀)
# Forward-diagonal first leg, perpendicular diagonal second leg; stop on capture.
piece = pc:fBbB2
# Soaring eagle (飛鷲)
piece = se:RbBfFfA
# Horned falcon (角鷹)
piece = hf:BrlbRfWfD
# Queen (奔王)
piece = q:Q
# Rushing bird (行鳥) -> Free demon
piece = rb:BfrlR +rb:<fr>
# Free demon (奔鬼)
piece = fr:rlRBfbR5
# Free dream-eater (奔獏)
# SOURCE CONFLICT: retain vertical rays from the displayed diagram/Betza; prose omits them.
piece = ft:fbRBrlR5
# Water buffalo (水牛) -> Free dream-eater
piece = wb:rlRBfbR2 +wb:<ft>
# Flying ox (飛牛)
piece = fo:BfbR
# Soldier (兵士)
piece = so:RbB
# Dragon king (龍王)
piece = dk:FR
# Dragon horse (龍馬)
piece = dh:WB
# Lion (獅子) -> Furious fiend
piece = ln:KNAD +ln:<ff>
# Furious fiend (奮迅)
# Lion + Lion Dog. Shared mask bits agree; ordinary leaps are defined here.
piece = ff:KNADGH
# Racing chariot (走車)
piece = sc:RbF
# Rook (飛車) -> Gold general
piece = r:R +r:<g>
# Bishop (角行) -> Gold general
piece = b:B +b:<g>
# White horse (白駒)
piece = wh:fQbR
# Whale (鯨鯢)
piece = w:fRbQ
# Standard bearer (前旗)
piece = sb:Q2fQ
# Vermillion sparrow (朱雀)
# Use main movement diagram, not Evans' swapped Sparrow/Turtle forms or Japanese alternative.
piece = vs:fBfWbRbB2
# Turtle-snake (玄武)
# SOURCE CONFLICT: use displayed diagram/Betza fQbWbB2; prose ambiguously says all diagonals.
piece = ts:fQbWbB2
# Blue dragon (青龍)
piece = bd:rlRfrBfbR2fF
# White tiger (白虎)
piece = wt:fbRflBrlR2fF
# Right chariot (右車)
piece = rc:fRfrblBbW
# Left chariot (左車)
piece = lc:fRflbrBbW
# Side dragon (横龍) -> Gold general
piece = si:frlRbW +si:<g>
# Dove (鳩槃)
piece = d:R2B5
# She-devil (夜叉) -> Gold general
piece = sd:R5B2 +sd:<g>
# Golden bird (金翅)
piece = go:fbRB3rlR2
# Great dragon (大龍)
piece = gd:rlRB3fbR2
# White elephant (白象)
piece = we:bBR2fB2
# Lion dog (狛犬) -> Great elephant
piece = ld:KADGH +ld:<ge>
# Great elephant (大象)
# Use the article's six-direction Lion Dog power, excluding the two forward diagonals.
piece = ge:RbBfB2DHbAbG
# Wrestler (力士) -> Gold general
piece = wr:B3rlW +wr:<g>
# Guardian of the Gods (金剛) -> Gold general
piece = gg:R3fF +gg:<g>
# Buddhist devil (羅刹) -> Gold general
piece = bu:fB3rlbW +bu:<g>
# Golden deer (金鹿)
piece = gl:fBbB2
# Silver hare (銀兎)
piece = sv:fB2bB
# Fierce eagle (猛鷲)
# Use main B2rlW definition; the Japanese-source alternative differs (article footnote 13).
piece = fe:B2rlW
# Old kite (古鵄) -> Long-nosed goblin
piece = ok:R2fF +ok:<lo>
# Violent ox (猛牛)
piece = vo:R2
# Flying dragon (飛龍) -> Gold general
# Use main table: promotes to Gold General, not the alternative Dragon King.
piece = fd:B2 +fd:<g>
# Old rat (老鼠) -> Wizard stork
# Use main table: promotes to Wizard Stork, not the alternative Bat.
piece = or:fB2bR2 +or:<wz>
# Wizard stork (*仙鶴)
piece = wz:BfRbW
# Enchanted badger (変狸) -> Dove
piece = en:frlR2 +en:<d>
# Flying horse (馬麟) -> Queen
piece = fh:fB2W +fh:<q>
# Prancing stag (踊鹿) -> Square mover
piece = pr:rlR2FfW +pr:<sq>
# Square mover (方行)
piece = sq:RfF
# Violent bear (猛熊)
piece = vb:fB2rlW
# Side mover (横行) -> Gold general
piece = sm:rlRW +sm:<g>
# Vertical mover (竪行) -> Gold general
piece = vm:fbRW +vm:<g>
# Reverse chariot (反車)
piece = rv:fbR
# Phoenix (鳳凰) -> Golden bird
piece = ph:WA +ph:<go>
# Kirin (麒麟) -> Great dragon
piece = kr:FD +kr:<gd>
# Poisonous snake (毒蛇) -> Hook mover
piece = ps:rlWfDbA +ps:<hm>
# Northern barbarian (北狄) -> Fragrant elephant
piece = nb:fB2rlWF +nb:<fa>
# Fragrant elephant (香象)
piece = fa:fBR2bB2
# Southern barbarian (南蛮) -> White elephant
piece = su:bB2rlWF +su:<we>
# Eastern barbarian (東夷) -> Lion
piece = eb:fbR2rlWfF +eb:<ln>
# Western barbarian (西戎) -> Lion dog
piece = ws:rlR2fbWfF +ws:<ld>
# Blind bear (盲熊)
piece = bb:FbR
# Drunken elephant (醉象) -> Prince
piece = de:FfrlW +de:<cp>
# Neighboring king (近王) -> Standard bearer
piece = nk:K +nk:<sb>
# Blind tiger (盲虎)
piece = bt:FrlbW
# Blind monkey (盲猿) -> Mountain witch
# Use main table: promotes to Mountain Witch. Old Monkey remains unpromotable.
piece = bm:FrlW +bm:<mw>
# Mountain witch (山母)
piece = mw:BbRfW
# Ferocious leopard (猛豹)
piece = fl:FfbW
# Reclining dragon (臥龍)
piece = rd:WbF
# Chinese cock (淮鶏) -> Wizard stork
piece = cc:rlbWfF +cc:<wz>
# Old monkey (古猿)
piece = om:FbW
# Evil wolf (悪狼)
piece = ew:frlK
# Angry boar (嗔猪)
piece = ab:W
# Cat sword (猫刄)
piece = cs:F
# Coiled serpent (蟠蛇)
piece = co:fbWbF
# Deva (提婆) -> Teaching king
# INCOMPLETE: capturing a Deva should transform the capturer into a Teaching King; contagion is not implemented.
piece = dv:fbrFlW +dv:<tk>
# Teaching king (教王)
# INCOMPLETE: movement is supplied, but its contagious transformation of capturers is not implemented.
piece = tk:QADGH
# Dark spirit (無明) -> Buddhist spirit
# INCOMPLETE: capturing a Dark Spirit should transform the capturer into a Buddhist Spirit; contagion is not implemented.
piece = ds:fblFrW +ds:<bs>
# Buddhist spirit (法性)
# INCOMPLETE: movement is supplied, but its contagious transformation of capturers is not implemented.
piece = bs:QNAD
# Right general (右将)
piece = rg:FflbW
# Left general (左将)
piece = lg:FfrbW
# Gold general (金将)
piece = g:WfF
# Silver general (銀将)
piece = s:FfW
# Copper general (銅将)
piece = c:fbWfF
# Tile general (瓦将)
piece = t:fFbW
# Iron general (鉄将)
piece = i:fK
# Wood general (木将)
piece = wo:fB2
# Stone general (石将)
piece = sg:fF
# Earth general (土将)
piece = ea:fbW
# Go-between (仲人)
piece = gb:fbW
# Knight (桂馬) -> Gold general
piece = n:ffN +n:<g>
# Howling dog (*𠵇( 口 奇)犬)
piece = hd:fRbW
# Donkey (驢馬) -> Gold general
# Use article's WfbD, including vertical steps; Western alternatives omit those steps.
piece = do:WfbD +do:<g>
# Ram's-head soldier (羊兵)
piece = rs:fB
# Lance (香車)
piece = l:fR
# Pawn (歩兵)
piece = p:fW

# Lion paths are supplemental; ordinary steps and jumps are in piece above.
lionMovePieces = ln(FFFFFFFFFFFFFFFF) ff(FFFFFFFFFFFFFFFF) bs(FFFFFFFFFFFFFFFF) hf(0000000000000011) se(8800000000002200)
# Silverman Lion Dog interpretation already implemented by the engine:
# the triple steps stay on one ray; no 0->1->3 path; no overshoot of the origin.
lionDogMovePieces = ld:FFFFFFFFFFFF ff:FFFFFFFFFFFF tk:FFFFFFFFFFFF ge:03FFFFFFF03F
# All hooks stop on their first capture; first-leg-only moves come from piece.
hookMovePieces = hm:R-sR:1! lo:B-sB:1! ca:B-sB:1! pc:fB-sB:1!

# The Emperor may capture protected non-royals, but only unprotected royals.
# Promoted Drunken Elephants use the Prince slot and are covered here too.
tradingRule = e:[any!,{e,cp}]

# No promotion zones: compulsory promotion on a promotable piece's first capture.
# Already promoted pieces do not promote again. Contagion is the missing exception.
promotionRegionOptionalWhite = -
promotionRegionOptionalBlack = -
promotionRegionMandatoryWhite = *
promotionRegionMandatoryBlack = *
promotionPolicy = optional:{} mandatory:{iic}

# Engine adjudication choices: no move-count draw; fourfold repetition draws;
# stalemate loses. The article's attack/pursuit/pass-specific repetition rules
# are not reproduced by this blanket repetition setting.
nMoveRule = 0
nFoldRule = 4
nFoldValue = draw
stalemateValue = loss

# Capture all enemy royals: Emperor AND all Princes, including +DE.
# No checkmate legality or baring condition is enabled.
extinctionValue = loss
extinctionPseudoRoyal = false
extinctionCondition = and(e=0,cp=0)

